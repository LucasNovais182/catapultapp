<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LoL Catapult Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Importa a fonte Inter para o estilo Blitz.gg */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            /* Garante que o body não tenha margens, para o overlay ficar bem ajustado */
            margin: 0;
            overflow: hidden; /* Evita barras de rolagem */
        }
        #timer-overlay {
            user-select: none;
            /* Fundo escuro e opaco (90%) como o Blitz.gg */
            background-color: rgba(18, 20, 24, 0.90); /* Ajustado para 90% */
            border-radius: 10px; /* Cantos arredondados */
            padding: 0.5rem 0.75rem; /* Espaçamento interno (menor) */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Sombra suave */
            
            /* IMPORTANTE: O overlay deve preencher a janela do Electron. */
            /* O tamanho (width/height) deve ser definido no seu index.js */
            width: 230px;
            height: 50px;
            
            /* O overlay inteiro é arrastável por padrão */
            -webkit-app-region: drag;
            cursor: grab;
            
            /* Borda para feedback de travamento */
            border: 2px solid #34495e; /* Borda cinza/azul padrão */
            transition: border-color 0.2s ease-in-out;
            box-sizing: border-box; /* Garante que a borda não aumente o tamanho */
        }
        /* Estilos específicos para os textos e linhas, similar ao Blitz.gg */
        .text-label {
            color: #7f8c8d; /* Cinza suave */
            font-size: 0.65rem; /* Muito menor */
            font-weight: 500; /* Medium weight */
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .timer-value {
            color: #ffeaa7; /* Amarelo/âmbar para os timers */
            font-size: 1.25rem; /* Menor */
            font-weight: 700; /* Bold */
        }
    </style>
</head>
<body class="bg-transparent">

    <div id="timer-overlay">
        <!-- Timer de Canhão -->
        <div class="flex justify-between items-center">
            <div class="text-label">Canhão</div>
            <div id="cannon-timer" class="timer-value text-amber-400">--:--</div>
        </div>
    </div>

    <script>
        // --- Referências aos Elementos ---
        const cannonTimerEl = document.getElementById('cannon-timer');
        const overlayEl = document.getElementById('timer-overlay');
        
        // --- Estado ---
        let isClickThrough = false; // Estado do click-through
        let timerInterval = null;
        let gameTimeInSeconds = 0;
        let isTimerRunning = false;

        // --- Constantes do Jogo ---
        const WAVE_SPAWN_START_TIME = 65; // 1:05 - primeira onda
        const WAVE_SPAWN_INTERVAL = 30; // Intervalo entre ondas (30 segundos)
        
        // Timers exatos das ondas de canhão (em segundos)
        // Wave 4 — 02:35, Wave 7 — 04:05, Wave 10 — 05:35, etc.
        const CANNON_WAVE_TIMES = [
            155,  // Wave 4 — 02:35
            245,  // Wave 7 — 04:05
            335,  // Wave 10 — 05:35
            425,  // Wave 13 — 07:05
            515,  // Wave 16 — 08:35
            605,  // Wave 19 — 10:05
            695,  // Wave 22 — 11:35
            785,  // Wave 25 — 13:05
            875   // Wave 28 — 14:35
        ];
        
        const LAST_CANNON_TIME = 875; // 14:35 - última onda de canhão

        // --- Funções ---
        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = Math.floor(totalSeconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Encontra o tempo até a próxima onda de canhão
        function findNextCannonTime(currentTimeInSeconds) {
            // Se já passou da última onda de canhão, retorna 0
            if (currentTimeInSeconds >= LAST_CANNON_TIME) {
                return 0;
            }
            
            // Encontra a próxima onda de canhão
            for (let i = 0; i < CANNON_WAVE_TIMES.length; i++) {
                if (CANNON_WAVE_TIMES[i] > currentTimeInSeconds) {
                    return CANNON_WAVE_TIMES[i] - currentTimeInSeconds;
                }
            }
            
            // Não deveria chegar aqui, mas retorna 0 como fallback
            return 0;
        }

        function updateAllTimers() {
            // Calcula o tempo até a próxima onda de canhão
            const timeToNextCannon = findNextCannonTime(gameTimeInSeconds);
            cannonTimerEl.textContent = formatTime(timeToNextCannon);
        }
        
        // --- LÓGICA DE TRAVAMENTO (Double-Click) - RESTAURADA ---
        overlayEl.addEventListener('dblclick', () => {
            isClickThrough = !isClickThrough;
            if (isClickThrough) {
                // Ativa o click-through (cliques atravessam a janela)
                window.electronAPI.setIgnoreMouseEvents(true, { forward: true });
                overlayEl.style.webkitAppRegion = 'no-drag'; // Impede de arrastar
                overlayEl.style.cursor = 'default';
                overlayEl.style.borderColor = '#22c55e'; // Borda verde (travado)
            } else {
                // Desativa o click-through (permite clicar/arrastar)
                window.electronAPI.setIgnoreMouseEvents(false);
                overlayEl.style.webkitAppRegion = 'drag'; // Permite arrastar
                overlayEl.style.cursor = 'grab';
                overlayEl.style.borderColor = '#34495e'; // Borda padrão
            }
        });

        // Função para iniciar o timer
        function startTimer() {
            if (isTimerRunning) return; // Evita múltiplos timers
            
            isTimerRunning = true;
            gameTimeInSeconds = 0; // Reseta o tempo quando inicia
            
            timerInterval = setInterval(() => {
                gameTimeInSeconds++;
                updateAllTimers(); 
            }, 1000);
            updateAllTimers();
        }

        // Função para parar o timer
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTimerRunning = false;
            gameTimeInSeconds = 0;
            cannonTimerEl.textContent = '--:--';
        }

        // Escuta mensagem do processo principal para iniciar o timer
        window.electronAPI.onTimerStart(() => {
            startTimer();
        });

        // Escuta mensagem do processo principal para parar o timer
        window.electronAPI.onTimerStop(() => {
            stopTimer();
        });

        // Inicialização - timer NÃO começa automaticamente
        // Será iniciado quando a partida for detectada
        updateAllTimers();
    </script>
</body>
</html>
